<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VILQA Registration</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
        }

        body {
            font-family: 'Space Grotesk', -apple-system, sans-serif;
            background: #F5F7F0;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 20px;
        }

        .container {
            background: #FFFFFF;
            border-radius: 32px;
            padding: 40px 32px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            margin: 0 auto 40px;
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 8px;
        }

        .logo-badge {
            font-size: 40px;
        }

        .logo h1 {
            font-size: 48px;
            font-weight: 700;
            background: linear-gradient(135deg, #2D3436 0%, #636E72 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -2px;
        }

        .logo p {
            color: #636E72;
            font-size: 15px;
            font-weight: 500;
        }

        .error-message {
            background: rgba(255, 107, 107, 0.1);
            border: 2px solid #FF6B6B;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
            color: #FF6B6B;
            font-weight: 600;
            text-align: center;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .debug-info {
            background: #F8F9FA;
            border: 2px solid #E9ECEF;
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 11px;
            color: #636E72;
            font-family: monospace;
            max-height: 150px;
            overflow-y: auto;
            display: none;
        }

        .debug-info.show {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #2D3436;
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 16px;
            background: #F8F9FA;
            border: 2px solid #E9ECEF;
            border-radius: 16px;
            color: #2D3436;
            font-size: 16px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 500;
        }

        input:focus,
        select:focus {
            outline: none;
            background: #FFFFFF;
            border-color: #DCFF64;
            box-shadow: 0 0 0 4px rgba(220, 255, 100, 0.2);
        }

        form.submitted input:invalid,
        form.submitted select:invalid {
            border-color: #FF6B6B;
            background: rgba(255, 107, 107, 0.05);
        }

        select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml,%3Csvg width='14' height='9' viewBox='0 0 14 9' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L7 7L13 1' stroke='%232D3436' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 16px center;
            padding-right: 40px;
        }

        .radio-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .radio-option input {
            display: none;
        }

        .radio-option label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: #F8F9FA;
            border: 2px solid #E9ECEF;
            border-radius: 16px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            color: #636E72;
            position: relative;
            overflow: hidden;
        }

        .radio-option input:checked + label {
            border-color: #DCFF64;
            background: linear-gradient(135deg, #DCFF64 0%, #B4F064 100%);
            color: #2D3436;
        }

        .two-columns {
            display: grid !important;
            grid-template-columns: 1fr 1fr !important;
            gap: 12px !important;
        }

        .submit-button {
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, #2D3436 0%, #636E72 100%);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 24px;
            box-shadow: 0 12px 32px rgba(45, 52, 54, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .submit-button.ready {
            background: linear-gradient(135deg, #DCFF64 0%, #B4F064 100%);
            color: #2D3436;
            box-shadow: 0 12px 32px rgba(220, 255, 100, 0.4);
        }

        .submit-button:active {
            transform: scale(0.98);
        }

        .submit-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .success-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(245, 247, 240, 0.95);
            z-index: 999;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .success-overlay.show {
            display: flex;
        }

        .success-message {
            background: linear-gradient(135deg, #DCFF64 0%, #B4F064 100%);
            color: #2D3436;
            padding: 48px;
            border-radius: 32px;
            font-size: 32px;
            font-weight: 700;
            text-align: center;
        }

        @media (max-width: 400px) {
            .container {
                padding: 32px 20px;
            }
            
            .logo h1 {
                font-size: 36px;
            }
            
            input, select {
                font-size: 15px;
                padding: 14px;
            }
            
            label {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="success-overlay" id="overlay">
        <div class="success-message">✨ Готово!</div>
    </div>

    <div class="container">
        <div class="logo">
            <div class="logo-header">
                <span class="logo-badge">🥗</span>
                <h1>VILQA</h1>
            </div>
            <p>Начни заботиться о себе</p>
        </div>

        <div class="error-message" id="errorMessage"></div>
        <div class="debug-info" id="debugInfo"></div>

        <form id="registrationForm">
            <div class="form-group">
                <label for="name">Имя</label>
                <input type="text" id="name" name="name" required placeholder="Введите имя">
            </div>

            <div class="two-columns">
                <div class="form-group">
                    <label>Пол</label>
                    <div class="radio-group">
                        <div class="radio-option">
                            <input type="radio" id="male" name="gender" value="male" required>
                            <label for="male">👨</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="female" name="gender" value="female" required>
                            <label for="female">👩</label>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="age">Возраст</label>
                    <input type="number" id="age" name="age" required placeholder="18" min="10" max="120">
                </div>
            </div>

            <div class="two-columns">
                <div class="form-group">
                    <label for="height">Рост, см</label>
                    <input type="number" id="height" name="height" required placeholder="170" min="100" max="250">
                </div>

                <div class="form-group">
                    <label for="weight">Вес, кг</label>
                    <input type="number" id="weight" name="weight" required placeholder="70" min="30" max="300" step="0.1">
                </div>
            </div>

            <div class="form-group">
                <label for="activity">Активность</label>
                <select id="activity" name="activity" required>
                    <option value="">Выберите уровень активности</option>
                    <option value="1.2">🪑 Сидячий</option>
                    <option value="1.375">🚶 Минимальная</option>
                    <option value="1.55">🏃 Умеренная</option>
                    <option value="1.725">💪 Высокая</option>
                    <option value="1.9">🏋️ Очень высокая</option>
                </select>
            </div>

            <div class="form-group">
                <label for="goal">Цель</label>
                <select id="goal" name="goal" required>
                    <option value="">Выберите вашу цель</option>
                    <option value="lose">⬇️ Похудеть</option>
                    <option value="lose_fast">⬇️⬇️ Быстро похудеть</option>
                    <option value="maintain">➡️ Держать вес</option>
                    <option value="gain">⬆️ Набрать массу</option>
                    <option value="gain_fast">⬆️⬆️ Быстро набрать</option>
                </select>
            </div>

            <!-- Скрытое поле для определения timezone -->
            <input type="hidden" id="timezone" name="timezone" value="">

            <button type="submit" class="submit-button" id="submitButton">
                Начать путь 🚀
            </button>
        </form>
    </div>

    <script>
document.addEventListener('DOMContentLoaded', function () {

  const tg = window.Telegram?.WebApp;
  const isTelegramWebApp = !!tg;

  if (tg) {
    tg.ready();
    tg.expand();
    try { tg.MainButton.hide(); } catch {}
  }

  const form = document.getElementById('registrationForm');
  const submitButton = document.getElementById('submitButton');
  const errorMessage = document.getElementById('errorMessage');
  const overlay = document.getElementById('overlay');

  function showError(msg) {
    errorMessage.textContent = msg;
    errorMessage.classList.add('show');
    setTimeout(() => errorMessage.classList.remove('show'), 4000);
  }

  // timezone
  try {
    document.getElementById('timezone').value =
      Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
  } catch {
    document.getElementById('timezone').value = 'UTC';
  }

  // Telegram user
  let telegramData = {};
  if (isTelegramWebApp && tg.initDataUnsafe?.user) {
    const u = tg.initDataUnsafe.user;
    telegramData = {
      telegram_id: u.id,
      telegram_username: u.username || '',
      telegram_first_name: u.first_name || '',
      telegram_last_name: u.last_name || '',
      telegram_language: u.language_code || 'ru'
    };
    if (u.first_name) {
      document.getElementById('name').value = u.first_name;
    }
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    form.classList.add('submitted');

    if (!form.checkValidity()) {
      showError('❗ Заполните все поля корректно');
      return;
    }

    submitButton.disabled = true;
    submitButton.textContent = 'Отправка...';

    const data = Object.fromEntries(new FormData(form));
    Object.assign(data, telegramData);
    data.registrationDate = new Date().toISOString();

    const webhookUrl = 'https://n8n.svoidigital.ru/webhook/vilqa-registration';

    // 🔥 ВАЖНО: fire-and-forget
    fetch(webhookUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    }).catch(() => {
      // только если вообще нет сети
      showError('❌ Не удалось отправить данные');
      submitButton.disabled = false;
      submitButton.textContent = 'Начать путь 🚀';
    });

    // ✅ UX: сразу показываем успех и закрываем
    overlay.classList.add('show');

    setTimeout(() => {
      if (isTelegramWebApp && tg) {
        tg.close();
      } else {
        location.reload();
      }
    }, 200);
  });

});
</script>

</body>
</html>
